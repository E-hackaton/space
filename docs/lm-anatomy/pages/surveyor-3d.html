.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}

.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}

.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}

@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

/* FORBITS · nuit-lune tokens mapped onto the anatomy kit */
.iso {
  --anatomy-page: #090d16;
  --anatomy-card: #0e1320;
  --anatomy-text: #b3bccb;
  --anatomy-strong: #eef2f8;
  --anatomy-muted: #6d7a92;
  --anatomy-paper: #0e1320;
  --anatomy-face: #172036;
  --anatomy-top: #1a2338;
  --anatomy-shade-0: #0b101b;
  --anatomy-shade-1: #0e1421;
  --anatomy-shade-2: #121928;
  --anatomy-shade-3: #151d2f;
  --anatomy-lit-top: #2a3a5c;
  --anatomy-lit-shade: #1f2c47;
  --anatomy-hi: #dfe7f3;
  --anatomy-mid: #6f7e99;
  --anatomy-lo: #3b465f;
  --anatomy-faint: #252f45;
  --anatomy-lit: #ffffff;
  --anatomy-halo: #02040a;
  --anatomy-dot: #dfe7f3;
  --lm-moon: #9ec3f0;
  --lm-brand: #ffc83d;
  --lm-foil-0: #2a2210;
  --lm-foil-1: #352a12;
  --lm-foil-2: #423414;
  --lm-foil-3: #4f3e17;
  --lm-foil-top: #5a4719;
  --lm-foil-line: #b8913a;
  --lm-foil-faint: #5f4a1c;
  --lm-glass: #04070d;
  --lm-void: #05080f;
  --lm-cells: #121c33;
  --lm-crater: #0b101b;
  --lm-bezel: #121a2b;
  --lm-cloth: #2a3550;
  --lm-blend: screen;
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
}
.iso[data-theme="light"] {
  --anatomy-page: #e2e8f1;
  --anatomy-card: #eef2f8;
  --anatomy-text: #525b69;
  --anatomy-strong: #141a24;
  --anatomy-muted: #75808f;
  --anatomy-paper: #eef2f8;
  --anatomy-face: #ffffff;
  --anatomy-top: #ffffff;
  --anatomy-shade-0: #cfd7e3;
  --anatomy-shade-1: #d9e0ea;
  --anatomy-shade-2: #e3e9f1;
  --anatomy-shade-3: #ebf0f6;
  --anatomy-lit-top: #ffffff;
  --anatomy-lit-shade: #dde8f8;
  --anatomy-hi: #141a24;
  --anatomy-mid: #75808f;
  --anatomy-lo: #a7b1bf;
  --anatomy-faint: #cbd3de;
  --anatomy-lit: #1f4f8f;
  --anatomy-halo: #4b5a75;
  --anatomy-dot: #2a3240;
  --lm-moon: #1f4f8f;
  --lm-foil-0: #c99a2e;
  --lm-foil-1: #d6a93e;
  --lm-foil-2: #e2b952;
  --lm-foil-3: #ecc867;
  --lm-foil-top: #f3d687;
  --lm-foil-line: #7a5513;
  --lm-foil-faint: #b88a2a;
  --lm-glass: #2b3546;
  --lm-void: #3a4558;
  --lm-cells: #9fb2d6;
  --lm-crater: #dfe5ee;
  --lm-bezel: #e4e9f1;
  --lm-cloth: #ffffff;
  --lm-blend: normal;
}

.iso-page { width: min(1080px, 100% - 32px); }
.lm .iso-plate { position: relative; padding: 48px 20px 64px; overflow: hidden; }
.lm .iso-plate-corner { font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
.lm .iso-plate-corner[data-corner="title"] { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.01em; color: var(--anatomy-strong); }

/* gold Kapton on the descent stage, black blanket on its top band */
.lm-foil {
  --anatomy-paper: var(--lm-foil-1);
  --anatomy-shade-0: var(--lm-foil-0);
  --anatomy-shade-1: var(--lm-foil-1);
  --anatomy-shade-2: var(--lm-foil-2);
  --anatomy-shade-3: var(--lm-foil-3);
  --anatomy-top: var(--lm-foil-top);
  --anatomy-hi: var(--lm-foil-line);
  --anatomy-lo: var(--lm-foil-line);
  --anatomy-faint: var(--lm-foil-faint);
}
.lm-black {
  --anatomy-shade-0: #06080d;
  --anatomy-shade-1: #080b12;
  --anatomy-shade-2: #0a0e16;
  --anatomy-shade-3: #0c111a;
  --anatomy-top: #10151f;
}
.iso[data-theme="light"] .lm-black {
  --anatomy-shade-0: #3b4251;
  --anatomy-shade-1: #454d5d;
  --anatomy-shade-2: #4f5868;
  --anatomy-shade-3: #5a6373;
  --anatomy-top: #677081;
  --anatomy-paper: #4f5868;
}
.lm-glass { fill: var(--lm-glass); stroke: none; }
.lm-void { fill: var(--lm-void); stroke: none; }
.lm-cells { fill: var(--lm-cells); stroke: none; }
.lm-crater { fill: var(--lm-crater); stroke: none; }
.lm-bezel { fill: var(--lm-bezel); stroke: none; }
.lm-flag-cloth { fill: var(--lm-cloth); stroke: none; }
.lm-flag-foot { fill: var(--anatomy-hi); }
.lm-debris circle { fill: var(--lm-brand); }
.iso[data-theme="light"] .lm-debris circle { fill: #b07a0c; }

/* stage and layers */
.lm-stage { position: relative; touch-action: pan-y; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; border-radius: 10px; }
.lm-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.lm-stage > svg, .lm-stage > canvas, .lm-stage > div { display: block; width: 100%; height: auto; }
.lm-front, .lm-gl, .lm-flash { position: absolute; inset: 0; height: 100% !important; }
.lm-gl, .lm-flash { pointer-events: none; mix-blend-mode: var(--lm-blend); }
.lm-front { pointer-events: none; overflow: hidden; }
.lm-front .it { pointer-events: visiblePainted; }
.lm-back .it[data-piece="stand"] { pointer-events: none; }
.lm-flash { opacity: 0; background: radial-gradient(circle closest-side at var(--gx, 50%) var(--gy, 50%), #fff6dc 0%, #ffd27acc 22%, #ff9c4a55 52%, #ff9c4a00 100%); }
.iso[data-theme="light"] .lm-flash { mix-blend-mode: multiply; background: radial-gradient(circle closest-side at var(--gx, 50%) var(--gy, 50%), #ffd36b 0%, #ffbf4dcc 24%, #ffb24a44 56%, #ffb24a00 100%); }
.lm-stage[data-gl] .lm-fallback { display: none; }

/* selection: one assembly lit, everything else one step down */
.it { transition: opacity 240ms var(--anatomy-ease); }
.lm-stage[data-focus] .it:not([data-on]) { --anatomy-hi: var(--anatomy-mid); --anatomy-mid: var(--anatomy-lo); }
.lm-stage[data-focus] .it:not([data-on]) .lm-foil { --lm-foil-line: var(--lm-foil-faint); }
.it[data-on] { --anatomy-hi: var(--anatomy-lit); --anatomy-mid: var(--anatomy-hi); }
.it[data-on] .iso-top, .it[data-on] .tb-shine { fill: var(--anatomy-lit-top); }
.it[data-on] .iso-shade, .it[data-on] .tb-body { fill: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-shade { stroke: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-top { stroke: var(--anatomy-lit-top); }
.it[data-on] .lm-foil { --lm-foil-line: #ffe7a6; --lm-foil-top: #7a6124; --lm-foil-3: #6a5420; }
.iso[data-theme="light"] .it[data-on] .lm-foil { --lm-foil-line: #3d2a05; }
.it[data-gone] { opacity: 0; }

/* controls */
.lm-controls { position: absolute; left: 20px; bottom: 16px; right: 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lm-fire { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--anatomy-lo); background: var(--anatomy-face); color: var(--anatomy-strong); font: 700 13px/1 "Atkinson Hyperlegible", system-ui, sans-serif; cursor: pointer; }
.lm-fire:hover { border-color: var(--anatomy-mid); }
.lm-fire:focus-visible { outline: 2px solid var(--lm-brand); outline-offset: 2px; }
.lm-lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--anatomy-lo); transition: background 200ms, box-shadow 200ms; }
.lm-fire[data-state="burn"] .lm-lamp { background: var(--lm-brand); box-shadow: 0 0 10px var(--lm-brand); }
.lm-fire[data-state="left"] .lm-lamp { background: var(--lm-moon); }
.lm-hint { font-size: 12px; color: var(--anatomy-muted); }
.lm-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.lm .iso-plate-corner[data-corner="readout"] { bottom: 22px; font-variant-numeric: tabular-nums; }
.lm-lang { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: inline-flex; border: 1px solid var(--anatomy-faint); border-radius: 999px; overflow: hidden; z-index: 2; }
.lm-lang button { min-width: 40px; min-height: 26px; border: 0; background: transparent; color: var(--anatomy-muted); font: 700 11px/1 "Atkinson Hyperlegible", system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; }
.lm-lang button[aria-pressed="true"] { background: var(--anatomy-face); color: var(--anatomy-strong); }

/* legend: the parts as buttons */
.lm-parts { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 12px; }
.lm-part { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border: 1px solid var(--anatomy-faint); border-radius: 999px; background: transparent; color: var(--anatomy-text); font: 400 12.5px/1 "Atkinson Hyperlegible", system-ui, sans-serif; cursor: pointer; }
.lm-part:hover { border-color: var(--anatomy-lo); color: var(--anatomy-strong); }
.lm-part[data-on] { border-color: var(--anatomy-mid); color: var(--anatomy-strong); background: var(--anatomy-face); }
.lm-num { font-variant-numeric: tabular-nums; color: var(--anatomy-muted); font-size: 11px; }
.lm .iso-caption { max-width: 72ch; }

@media (max-width: 640px) {
  .lm .iso-plate { padding: 44px 8px 92px; }
  .lm-stage { margin: 0 -8%; width: 116%; }
  .lm-hint { display: none; }
  .lm .iso-plate-corner[data-corner="readout"] { bottom: 62px; }
  .lm-lang { top: auto; bottom: 20px; left: auto; right: 16px; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .it { transition: none; }
}

/* 360° version: the live layer takes hover, the stage takes drag */
.lm-stage.iso-turn { cursor: grab; }
.lm-stage[data-drag] { cursor: grabbing; }
.lm-stage .iso-live [data-name] { pointer-events: visiblePainted; }
.lm-stage .iso-live [data-name^="ground."] { pointer-events: none; }
.lm-over { overflow: hidden; }
.lm-screw { fill: var(--anatomy-dot); opacity: .5; }
.lm-cell { fill: var(--anatomy-hi); opacity: .55; }
.lm-foil-lines .iso-line { stroke: var(--lm-foil-line); }
.lm-foil-lines .iso-line[data-tone="faint"] { stroke: var(--lm-foil-faint); }
.lm-foil-lines .lm-screw { fill: var(--lm-foil-line); }
.lm-stage .iso-live [data-on] {
  --tn-0: var(--anatomy-lit-shade); --tn-1: var(--anatomy-lit-shade); --tn-2: var(--anatomy-lit-shade); --tn-3: var(--anatomy-lit-shade); --tn-4: var(--anatomy-lit-top);
  --anatomy-hi: var(--anatomy-lit); --anatomy-mid: var(--anatomy-hi); --anatomy-paper: var(--anatomy-lit-shade);
}
.lm-stage .iso-live [data-on] .iso-edge, .lm-stage .iso-live [data-on] [class*="edge"] { stroke: var(--anatomy-lit); }

sis en treillis</span></button><button type="button" class="lm-part" data-part="legs"><span class="lm-num">02</span><span data-t="part.legs">Jambes et patins</span></button><button type="button" class="lm-part" data-part="verniers"><span class="lm-num">03</span><span data-t="part.verniers">Moteurs verniers</span></button><button type="button" class="lm-part" data-part="tanks"><span class="lm-num">04</span><span data-t="part.tanks">Réservoirs</span></button><button type="button" class="lm-part" data-part="retro"><span class="lm-num">05</span><span data-t="part.retro">Support du rétrofusée</span></button><button type="button" class="lm-part" data-part="mast"><span class="lm-num">06</span><span data-t="part.mast">Mât</span></button><button type="button" class="lm-part" data-part="antenna"><span class="lm-num">07</span><span data-t="part.antenna">Antenne plane</span></button><button type="button" class="lm-part" data-part="solar"><span class="lm-num">08</span><span data-t="part.solar">Panneau solaire</span></button><button type="button" class="lm-part" data-part="compartments"><span class="lm-num">09</span><span data-t="part.compartments">Compartiments thermiques</span></button><button type="button" class="lm-part" data-part="camera"><span class="lm-num">10</span><span data-t="part.camera">Caméra TV</span></button><button type="button" class="lm-part" data-part="omni"><span class="lm-num">11</span><span data-t="part.omni">Antennes omnidirectionnelles</span></button><button type="button" class="lm-part" data-part="sampler"><span class="lm-num">12</span><span data-t="part.sampler">Bras d'échantillonnage</span></button></span><span class="iso-caption" data-t="caption">Surveyor 3 s'est posée le 20 avril 1967 dans l'Océan des Tempêtes, après deux rebonds : ses moteurs ne s'étaient pas coupés. Son bras a creusé les premières tranchées du sol lunaire et sa caméra a pris 6 315 images. Deux ans et demi plus tard, Apollo 12 s'est posé à 183 m : Pete Conrad et Alan Bean ont démonté la caméra et la pelle pour les rapporter sur Terre. La sonde est toujours là.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);

        t = [g.origin[0], g.origin[1], g.origin[2]];
      }
      if (v.t) {
        t[0] += v.t[0];
        t[1] += v.t[1];
        t[2] += v.t[2];
      }
    }
    if (!parent) {
      const pose = { R, t, value: v };
      if (g.kind === "turn") Object.assign(pose, { turn: v, pivot: [g.origin[0], g.origin[1]], root: true });
      list.push(pose);
      continue;
    }
    const tw = t3Apply(parent.R, t);
    list.push({ R: t3Mul(parent.R, R), t: [tw[0] + parent.t[0], tw[1] + parent.t[1], tw[2] + parent.t[2]], value: v });
  }
  return list;
}

function t3PosesMap(groups, values) {
  const list = t3Poses(groups, values);
  return new Map(groups.map((g, index) => [g.name, list[index]]));
}

function t3Roles(part) {
  const roles = [];
  const spec = part.spec;
  const details = part.details ?? {};
  const add = (name, type, extra = {}) => roles.push({ name, type, ...extra });
  const tone = part.tone ?? "hi";
  const crease = part.crease ?? "faint";
  const fadedSlots = (prefix, count, cls, lineTone) => {
    for (let j = 0; j < count; j++) add(`${prefix}${j}`, "slot", { cls, tone: lineTone });
  };
  const planes = () => (part.planes ?? []).forEach((_, j) => add(`plane${j}`, "plane"));
  const dots = () => (part.dots ?? []).forEach((dot, j) => add(`c${j}`, "dot", { tone: dot.tone ?? "mid", size: dot.size ?? 0.5 }));
  const sheets = (top) => {
    for (let t = 0; t < 4; t++) add(`s${t}`, "path", { cls: "iso-shade", shade: t });
    if (top) add("s4", "path", { cls: "iso-top" });
  };
  const inner = () => {
    if ((details.seams && details.seams.length) || (details.ribs && details.ribs.seams)) add("inner", "path", { cls: "iso-line", tone: "faint" });
  };
  const ribs = () => {
    if (details.ribs) fadedSlots("r", spec.slots?.ribs ?? 6, "iso-line", details.ribs.tone ?? "lo");
  };
  if (part.kind === "prism") {
    add("fill", "path", { cls: "iso-fill" });
    const faces = spec.ring.length / 2 + (spec.up ? 0 : 2);
    for (let j = 0; j < faces; j++) add(`f${j}`, "face");
    if (spec.up) add("top", "xform", { cls: "iso-top" });
    if (crease !== "none") add("crease", "path", { cls: "iso-line iso-crease", tone: crease });
    if (spec.bevel && crease !== "none") fadedSlots("v", spec.slots?.bevel ?? 6, "iso-line iso-bevel", crease);
    if (details.seams && details.seams.length) add("inner", "path", { cls: "iso-line", tone: "faint" });
    planes();
    add("edge", "path", { cls: "iso-line iso-edge", tone });
    dots();
  } else if (part.kind === "round" || part.kind === "lathe") {
    add("fill", "path", { cls: "iso-fill" });
    sheets(true);
    const ends = part.kind === "round" ? spec.ends : spec.caps.map((cap) => (cap ? "flat" : "open"));
    ends.forEach((end, j) => end === "flat" && add(`k${j}`, "face"));
    if (crease !== "none") add("crease", "path", { cls: "iso-line iso-crease", tone: crease });
    inner();
    ribs();
    planes();
    add("edge", "path", { cls: "iso-line iso-edge", tone });
    dots();
  } else if (part.kind === "ball") {
    add("fill", "path", { cls: "iso-fill" });
    sheets(false);
    spec.flats.forEach((_, j) => add(`f${j}`, "face"));
    if (crease !== "none") add("crease", "path", { cls: "iso-line iso-crease", tone: crease });
    planes();
    add("edge", "path", { cls: "iso-line iso-edge", tone });
    dots();
  } else if (part.kind === "tube") {
    add("body", "path", { cls: "tb-body" });
    if (spec.wide) {
      add("shine", "path", { cls: "tb-shine" });
      add("shade", "path", { cls: "tb-shade" });
    }
    if (spec.rings) fadedSlots("r", spec.slots?.ribs ?? 6, "tb-ring", spec.rings.tone ?? "lo");
    add("edges", "path", { cls: "iso-line tb-edge", tone });
  } else if (part.kind === "fixed") {
    add("move", "self");
    ribs();
    planes();
    dots();
  }
  return roles;
}

function t3Planes(list) {
  return (list ?? []).map((plane) => ({ o: plane.o, u: plane.u, v: plane.v, n: plane.n, fade: plane.fade ?? [0.04, 0.3], billboard: Boolean(plane.billboard) }));
}

function t3Dots(list) {
  return (list ?? []).map((dot) => ({ p: dot.p, n: dot.n ?? null, size: dot.size ?? 0.5, fade: dot.fade ?? [0.04, 0.42] }));
}

function t3PreparePrism(run, part) {
  const spec = part.spec;
  const n = spec.ring.length / 2;
  run.n = n;
  run.up = Boolean(spec.up);
  const ring = Float64Array.from(spec.ring);
  run.ring = ring;
  const nx = new Float64Array(n);
  const ny = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = ring[2 * j] - ring[2 * i];
    const dy = ring[2 * j + 1] - ring[2 * i + 1];
    const l = Math.hypot(dx, dy) || 1;
    nx[i] = dy / l;
    ny[i] = -dx / l;
  }
  run.nx = nx;
  run.ny = ny;
  const F = spec.up ? { o: [0, 0, 0], a: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] } : spec.F;
  run.F = F;
  run.s0 = spec.up ? spec.z0 : spec.s0;
  run.s1 = spec.up ? spec.z1 : spec.s1;
  const lo = new Float64Array(3 * n);
  const hi = new Float64Array(3 * n);
  const N3 = new Float64Array(3 * n);
  for (let i = 0; i < n; i++) {
    const x = ring[2 * i];
    const y = ring[2 * i + 1];
    for (let c = 0; c < 3; c++) {
      const base = F.o[c] + F.u[c] * x + F.v[c] * y;
      lo[3 * i + c] = base + F.a[c] * run.s0;
      hi[3 * i + c] = base + F.a[c] * run.s1;
      N3[3 * i + c] = F.u[c] * nx[i] + F.v[c] * ny[i];
    }
  }
  run.lo = lo;
  run.hi = hi;
  run.N3 = N3;
  run.sharp = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const p = (i - 1 + n) % n;
    run.sharp[i] = nx[p] * nx[i] + ny[p] * ny[i] < Math.cos(0.35) ? 1 : 0;
  }
  if (spec.bevel) {
    const inset = new Float64Array(2 * n);
    for (let i = 0; i < n; i++) {
      const p = (i - 1 + n) % n;
      const mx = nx[p] + nx[i];
      const my = ny[p] + ny[i];
      const l = Math.hypot(mx, my) || 1;
      inset[2 * i] = ring[2 * i] - (mx / l) * spec.bevel;
      inset[2 * i + 1] = ring[2 * i + 1] - (my / l) * spec.bevel;
    }
    run.inset = inset;
  }
  run.seams = part.details && part.details.seams ? part.details.seams.slice() : null;
  run.cut = spec.cuts && spec.cuts.length ? spec.cuts : null;
}

function t3Axes(run, part) {
  if (run.kind === "ball") return run.flats.map((flat) => flat.n);
  if (run.kind === "tube") return run.tips.slice();
  if (run.kind === "prism") {
    const out = [run.F.a];
    for (let i = 0; i < run.n; i++) {
      const n = [run.N3[3 * i], run.N3[3 * i + 1], run.N3[3 * i + 2]];
      if (out.every((m) => Math.abs(m[0] * n[0] + m[1] * n[1] + m[2] * n[2]) < 0.9995)) out.push(n);
    }
    return out;
  }
  if (run.F) return [run.F.a];
  if (part.spec && part.spec.F) return [part.spec.F.a];
  return [];
}

function t3Cloud(run, part) {
  const out = [];
  const ring = (F, s, r, count) => {
    for (let j = 0; j < count; j++) {
      const c = Math.cos((j / count) * T3_TAU);
      const n = Math.sin((j / count) * T3_TAU);
      out.push(F.o[0] + F.a[0] * s + r * (c * F.u[0] + n * F.v[0]), F.o[1] + F.a[1] * s + r * (c * F.u[1] + n * F.v[1]), F.o[2] + F.a[2] * s + r * (c * F.u[2] + n * F.v[2]));
    }
  };
  if (run.kind === "prism") {
    for (let i = 0; i < 3 * run.n; i++) out.push(run.lo[i]);
    for (let i = 0; i < 3 * run.n; i++) out.push(run.hi[i]);
  } else if (run.kind === "round") {
    ring(run.F, run.s0, run.r0, 24);
    ring(run.F, run.s1, run.r1, 24);
    for (const [end, s, r] of [[0, run.s0, run.r0], [1, run.s1, run.r1]]) {
      if (run.ends[end] !== "dome") continue;
      const sign = end ? 1 : -1;
      for (const b of [0.5, 1.0, 1.35]) ring(run.F, s + sign * r * Math.sin(b), r * Math.cos(b), 6);
      out.push(run.F.o[0] + run.F.a[0] * (s + sign * r), run.F.o[1] + run.F.a[1] * (s + sign * r), run.F.o[2] + run.F.a[2] * (s + sign * r));
    }
  } else if (run.kind === "ball") {
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < 64; i++) {
      const y = 1 - (2 * (i + 0.5)) / 64;
      const rad = Math.sqrt(1 - y * y);
      const w = [Math.cos(golden * i) * rad, Math.sin(golden * i) * rad, y];
      const p = [run.c[0] + run.r * w[0], run.c[1] + run.r * w[1], run.c[2] + run.r * w[2]];
      let inside = true;
      for (const flat of run.flats) if ((p[0] - run.c[0]) * flat.n[0] + (p[1] - run.c[1]) * flat.n[1] + (p[2] - run.c[2]) * flat.n[2] > flat.d + 1e-9) inside = false;
      if (inside) out.push(p[0], p[1], p[2]);
    }
    for (const flat of run.flats)
      for (let j = 0; j < 12; j++) {
        const c = Math.cos((j / 12) * T3_TAU) * flat.rho;
        const n = Math.sin((j / 12) * T3_TAU) * flat.rho;
        out.push(run.c[0] + flat.n[0] * flat.d + c * flat.u[0] + n * flat.v[0], run.c[1] + flat.n[1] * flat.d + c * flat.u[1] + n * flat.v[1], run.c[2] + flat.n[2] * flat.d + c * flat.u[2] + n * flat.v[2]);
      }
  } else if (run.kind === "lathe") {
    const lv = run.levels;
    const step = Math.max(4, Math.floor(lv.length / 4 / 8)) * 4;
    for (let i = 0; i < lv.length; i += step) ring(run.F, lv[i], lv[i + 1], 8);
    ring(run.F, lv[lv.length - 4], lv[lv.length - 3], 8);
  } else if (run.kind === "tube") {
    const b = run.body;
    const stride = Math.max(1, Math.floor(b.count / 8));
    for (let i = 0; i < b.count; i += stride) {
      const T = t3Unit([b.D3[3 * i], b.D3[3 * i + 1], b.D3[3 * i + 2]]);
      const [u, v] = t3Basis(T);
      ring({ o: [b.P3[3 * i], b.P3[3 * i + 1], b.P3[3 * i + 2]], a: T, u, v }, 0, run.r, 8);
    }
  } else if (part.cloud) for (const v of part.cloud) out.push(v);
  return Float64Array.from(out);
}

function t3Unpack(value, grouped) {
  if (!value) return new Float64Array(0);
  if (typeof value !== "string") return Float64Array.from(value);
  const text = atob(value);
  const bytes = new Uint8Array(text.length);
  for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i);
  const view = new DataView(bytes.buffer);
  const size = grouped ? 10 : 8;
  const stride = grouped ? 6 : 5;
  const count = bytes.length / size;
  const out = new Float64Array(count * stride);
  for (let e = 0; e < count; e++) {
    let o = e * size;
    const at = e * stride;
    out[at] = view.getUint16(o);
    out[at + 1] = view.getUint16(o + 2);
    o += 4;
    if (grouped) {
      out[at + 2] = view.getUint16(o) - 1;
      o += 2;
    }
    let x = (view.getUint16(o) / 65535) * 2 - 1;
    let y = (view.getUint16(o + 2) / 65535) * 2 - 1;
    const z = 1 - Math.abs(x) - Math.abs(y);
    if (z < 0) {
      const ox = (1 - Math.abs(y)) * (x >= 0 ? 1 : -1);
      const oy = (1 - Math.abs(x)) * (y >= 0 ? 1 : -1);
      x = ox;
      y = oy;
    }
    const l = Math.hypot(x, y, z) || 1;
    out[at + stride - 3] = x / l;
    out[at + stride - 2] = y / l;
    out[at + stride - 1] = z / l;
  }
  return out;
}

function t3Prepare(data, { unit = 1 } = {}) {
  const P = data.P;
  const runs = data.parts.map((part, index) => {
    const run = { index, name: part.name, kind: part.kind, group: part.group ?? -1, layer: part.layer, part, roles: t3Roles(part), planes: t3Planes(part.planes), dots: t3Dots(part.dots), unit };
    run.role = Object.fromEntries(run.roles.map((role, j) => [role.name, j]));
    if (part.kind === "prism") t3PreparePrism(run, part);
    else if (part.kind === "round") t3PrepareRound(run, part, P, unit);
    else if (part.kind === "ball") t3PrepareBall(run, part, P, unit);
    else if (part.kind === "lathe") t3PrepareLathe(run, part, P, unit);
    else if (part.kind === "tube") t3PrepareTube(run, part, data);
    else if (part.kind === "fixed") {
      run.anchor = part.spec.anchor;
      run.home = part.spec.home;
      run.box0 = part.spec.box;
      run.hull0 = Float64Array.from(part.spec.hull);
      run.F = part.spec.F ?? null;
      run.ribs = part.details && part.details.ribs ? part.details.ribs : null;
    }
    run.slots = part.spec.slots ?? {};
    run.cloud = t3Cloud(run, part);
    run.axes = t3Axes(run, part);
    const cn = run.cloud.length / 3;
    run.centroid = [0, 0, 0];
    for (let i = 0; i < cn; i++) for (let c = 0; c < 3; c++) run.centroid[c] += run.cloud[3 * i + c] / Math.max(1, cn);
    return run;
  });
  const layers = data.layers.map((layer, index) => {
    const parts = Int32Array.from(layer.parts);
    const local = new Map();
    parts.forEach((global, at) => local.set(global, at));
    const planar = t3Unpack(data.planes && data.planes[layer.name], false);
    const dynamic = Int32Array.from((data.dynamic && data.dynamic[layer.name]) ?? []);
    const free = Int32Array.from((data.free && data.free[layer.name]) ?? []);
    const framed = t3Unpack(data.framed && data.framed[layer.name], true);
    const groupPairs = [];
    const raw = (data.groupPairs && data.groupPairs[layer.name]) ?? [];
    const members = new Map();
    for (const global of parts) {
      const g = runs[global].group;
      if (!members.has(g)) members.set(g, []);
      members.get(g).push(global);
    }
    for (let p = 0; p < raw.length; p += 6) groupPairs.push({ a: Int32Array.from(members.get(raw[p]) ?? []), b: Int32Array.from(members.get(raw[p + 1]) ?? []), frame: raw[p + 2], n: [raw[p + 3], raw[p + 4], raw[p + 5]], boxA: new Float64Array(4), boxB: new Float64Array(4) });
    const looseAt = new Uint8Array(parts.length);
    for (const global of free) looseAt[local.get(global)] = 1;
    return { index, name: layer.name, parts, local, rest: Int32Array.from(layer.rest ?? layer.parts), planar, framed, groupPairs, dynamic, free, looseAt, warm: new Map() };
  });
  return { P, data, unit, groups: data.groups, runs, layers };
}

function t3Frame(run) {
  const count = run.roles.length;
  return { d: new Array(count).fill(""), q: new Int32Array(count), w: new Float64Array(count).fill(-1), t: new Array(count).fill(""), o: new Float64Array(count).fill(1), box: new Float64Array(4), hull: new Float64Array(64), hullN: 0, cx: new Float64Array(count), cy: new Float64Array(count), quads: null, quadN: 0 };
}

const t3Buf = { a: new Float64Array(1024), b: new Float64Array(1024), c: new Float64Array(1024) };

function t3Scratch(name, size) {
  if (t3Buf[name].length < size) t3Buf[name] = new Float64Array(size * 2);
  return t3Buf[name];
}

function t3SetHull(f, buf, count) {
  const hull = t3Grow(f, "hull", 2 * count, Float64Array);
  for (let i = 0; i < 2 * count; i++) hull[i] = buf[i];
  f.hullN = count;
}

function t3Faded(f, run, prefix, lines, count) {
  if (!f.fade) f.fade = {};
  const detail = t3State.detail;
  if (detail < 1) for (let i = 0; i < count; i++) lines.alpha[i] *= detail;
  if (detail < 0.01) count = 0;
  f.fade[prefix] = { key: lines.key.slice(0, count), alpha: lines.alpha.slice(0, count) };
  const slots = run.slots[prefix === "v" ? "bevel" : "ribs"] ?? 6;
  const levels = run._levels ?? (run._levels = new Array(T3_LEVELS + 1));
  for (let l = 0; l <= T3_LEVELS; l++) levels[l] = "";
  for (let i = 0; i < count; i++) {
    const alpha = lines.alpha[i];
    const level = Math.min(T3_LEVELS, Math.round(alpha * T3_LEVELS));
    if (level <= 0) continue;
    levels[level] += lines.d[i];
  }
  const present = [];
  for (let l = T3_LEVELS; l >= 1; l--) if (levels[l]) present.push([l, levels[l]]);
  while (present.length > slots) {
    let best = 1;
    let gap = Infinity;
    for (let i = 1; i < present.length; i++) {
      const g = present[i - 1][0] - present[i][0];
      if (g < gap) {
        gap = g;
        best = i;
      }
    }
    const [a, da] = present[best - 1];
    const [b, db] = present[best];
    present.splice(best - 1, 2, [(a + b) / 2, da + db]);
  }
  for (let j = 0; j < slots; j++) {
    const role = run.role[`${prefix}${j}`];
    if (role === undefined) continue;
    if (j < present.length) {
      f.d[role] = present[j][1];
      f.o[role] = present[j][0] / T3_LEVELS;
    } else {
      f.d[role] = "";
      f.o[role] = 0;
    }
  }
  return present.length;
}

const t3Lines = { d: [], alpha: [], key: [] };
const t3None = { d: [], alpha: [], key: [] };

function t3EmitPrism(run, cam, f) {
  const n = run.n;
  const m = cam.m;
  const ox = cam.ox;
  const oy = cam.oy;
  const V = cam.V;
  const L = cam.L;
  const lo = run.lo;
  const hi = run.hi;
  const N3 = run.N3;
  const bot = t3Scratch("a", 2 * n);
  const top = t3Scratch("b", 2 * n);
  for (let i = 0; i < n; i++) {
    const a = 3 * i;
    bot[2 * i] = ox + m[0] * lo[a] + m[1] * lo[a + 1] + m[2] * lo[a + 2];
    bot[2 * i + 1] = oy + m[3] * lo[a] + m[4] * lo[a + 1] + m[5] * lo[a + 2];
    top[2 * i] = ox + m[0] * hi[a] + m[1] * hi[a + 1] + m[2] * hi[a + 2];
    top[2 * i + 1] = oy + m[3] * hi[a] + m[4] * hi[a + 1] + m[5] * hi[a + 2];
  }
  const F = run.F;
  const aV = F.a[0] * V[0] + F.a[1] * V[1] + F.a[2] * V[2];
  const near = aV >= 0 ? top : bot;
  const far = aV >= 0 ? bot : top;
  const facing = run._facing ?? (run._facing = new Float64Array(n));
  for (let i = 0; i < n; i++) facing[i] = N3[3 * i] * V[0] + N3[3 * i + 1] * V[1] + N3[3 * i + 2] * V[2];
  const on = (i) => facing[((i % n) + n) % n] > 1e-9;
  let i0 = -1;
  for (let i = 0; i < n; i++)
    if (on(i) && !on(i - 1)) {
      i0 = i;
      break;
    }

  const farSet = aV >= 0 ? lo : hi;
  if (i0 < 0) {
    for (let i = 0; i < n; i++) {
      sil[2 * count] = near[2 * i];
      sil[2 * count + 1] = near[2 * i + 1];
      silAt[count] = i;
      count++;
    }
  } else {
    while (on(i1)) i1++;
    for (let j = i0; j <= i1; j++) {
      const i = j % n;
      sil[2 * count] = far[2 * i];
      sil[2 * count + 1] = far[2 * i + 1];
      silAt[count] = -1 - i;
      count++;
    }
    for (let j = i1; j <= i0 + n; j++) {
      const i = j % n;
      sil[2 * count] = near[2 * i];
      sil[2 * count + 1] = near[2 * i + 1];
      silAt[count] = i;
      count++;
    }
    if (count > 2 && Math.abs(sil[0] - sil[2 * count - 2]) < 1e-9 && Math.abs(sil[1] - sil[2 * count - 1]) < 1e-9) count--;
  }
  const outline = t3Path(sil, count, true);
  f.d[run.role.fill] = outline;
  if (run.cut) {
    const inPlane = (index) => {
      const at = silAt[index];
      const set = at < 0 ? farSet : nearSet;
