<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FORBITS · Module lunaire Eagle</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

</style></head><body class="iso" data-theme="light"><main class="iso-page"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet"><style>/* FORBITS · nuit-lune tokens mapped onto the anatomy kit */
.iso {
  --anatomy-page: #090d16;
  --anatomy-card: #0e1320;
  --anatomy-text: #b3bccb;
  --anatomy-strong: #eef2f8;
  --anatomy-muted: #6d7a92;
  --anatomy-paper: #0e1320;
  --anatomy-face: #172036;
  --anatomy-top: #1a2338;
  --anatomy-shade-0: #0b101b;
  --anatomy-shade-1: #0e1421;
  --anatomy-shade-2: #121928;
  --anatomy-shade-3: #151d2f;
  --anatomy-lit-top: #2a3a5c;
  --anatomy-lit-shade: #1f2c47;
  --anatomy-hi: #dfe7f3;
  --anatomy-mid: #6f7e99;
  --anatomy-lo: #3b465f;
  --anatomy-faint: #252f45;
  --anatomy-lit: #ffffff;
  --anatomy-halo: #02040a;
  --anatomy-dot: #dfe7f3;
  --lm-moon: #9ec3f0;
  --lm-brand: #ffc83d;
  --lm-foil-0: #2a2210;
  --lm-foil-1: #352a12;
  --lm-foil-2: #423414;
  --lm-foil-3: #4f3e17;
  --lm-foil-top: #5a4719;
  --lm-foil-line: #b8913a;
  --lm-foil-faint: #5f4a1c;
  --lm-glass: #04070d;
  --lm-void: #05080f;
  --lm-cells: #121c33;
  --lm-crater: #0b101b;
  --lm-bezel: #121a2b;
  --lm-cloth: #2a3550;
  --lm-blend: screen;
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
}
.iso[data-theme="light"] {
  --anatomy-page: #e2e8f1;
  --anatomy-card: #eef2f8;
  --anatomy-text: #525b69;
  --anatomy-strong: #141a24;
  --anatomy-muted: #75808f;
  --anatomy-paper: #eef2f8;
  --anatomy-face: #ffffff;
  --anatomy-top: #ffffff;
  --anatomy-shade-0: #cfd7e3;
  --anatomy-shade-1: #d9e0ea;
  --anatomy-shade-2: #e3e9f1;
  --anatomy-shade-3: #ebf0f6;
  --anatomy-lit-top: #ffffff;
  --anatomy-lit-shade: #dde8f8;
  --anatomy-hi: #141a24;
  --anatomy-mid: #75808f;
  --anatomy-lo: #a7b1bf;
  --anatomy-faint: #cbd3de;
  --anatomy-lit: #1f4f8f;
  --anatomy-halo: #4b5a75;
  --anatomy-dot: #2a3240;
  --lm-moon: #1f4f8f;
  --lm-foil-0: #c99a2e;
  --lm-foil-1: #d6a93e;
  --lm-foil-2: #e2b952;
  --lm-foil-3: #ecc867;
  --lm-foil-top: #f3d687;
  --lm-foil-line: #7a5513;
  --lm-foil-faint: #b88a2a;
  --lm-glass: #2b3546;
  --lm-void: #3a4558;
  --lm-cells: #9fb2d6;
  --lm-crater: #dfe5ee;
  --lm-bezel: #e4e9f1;
  --lm-cloth: #ffffff;
  --lm-blend: normal;
}

.iso-page { width: min(1080px, 100% - 32px); }
.lm .iso-plate { position: relative; padding: 48px 20px 64px; overflow: hidden; }
.lm .iso-plate-corner { font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
.lm .iso-plate-corner[data-corner="title"] { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.01em; color: var(--anatomy-strong); }

/* gold Kapton on the descent stage, black blanket on its top band */
.lm-foil {
  --anatomy-paper: var(--lm-foil-1);
  --anatomy-shade-0: var(--lm-foil-0);
  --anatomy-shade-1: var(--lm-foil-1);
  --anatomy-shade-2: var(--lm-foil-2);
  --anatomy-shade-3: var(--lm-foil-3);
  --anatomy-top: var(--lm-foil-top);
  --anatomy-hi: var(--lm-foil-line);
  --anatomy-lo: var(--lm-foil-line);
  --anatomy-faint: var(--lm-foil-faint);
}
.lm-black {
  --anatomy-shade-0: #06080d;
  --anatomy-shade-1: #080b12;
  --anatomy-shade-2: #0a0e16;
  --anatomy-shade-3: #0c111a;
  --anatomy-top: #10151f;
}
.iso[data-theme="light"] .lm-black {
  --anatomy-shade-0: #3b4251;
  --anatomy-shade-1: #454d5d;
  --anatomy-shade-2: #4f5868;
  --anatomy-shade-3: #5a6373;
  --anatomy-top: #677081;
  --anatomy-paper: #4f5868;
}
.lm-glass { fill: var(--lm-glass); stroke: none; }
.lm-void { fill: var(--lm-void); stroke: none; }
.lm-cells { fill: var(--lm-cells); stroke: none; }
.lm-crater { fill: var(--lm-crater); stroke: none; }
.lm-bezel { fill: var(--lm-bezel); stroke: none; }
.lm-flag-cloth { fill: var(--lm-cloth); stroke: none; }
.lm-flag-foot { fill: var(--anatomy-hi); }
.lm-debris circle { fill: var(--lm-brand); }
.iso[data-theme="light"] .lm-debris circle { fill: #b07a0c; }

/* stage and layers */
.lm-stage { position: relative; touch-action: pan-y; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; border-radius: 10px; }
.lm-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.lm-stage > svg, .lm-stage > canvas, .lm-stage > div { display: block; width: 100%; height: auto; }
.lm-front, .lm-gl, .lm-flash { position: absolute; inset: 0; height: 100% !important; }
.lm-gl, .lm-flash { pointer-events: none; mix-blend-mode: var(--lm-blend); }
.lm-front { pointer-events: none; overflow: hidden; }
.lm-front .it { pointer-events: visiblePainted; }
.lm-back .it[data-piece="stand"] { pointer-events: none; }
.lm-flash { opacity: 0; background: radial-gradient(circle closest-side at var(--gx, 50%) var(--gy, 50%), #fff6dc 0%, #ffd27acc 22%, #ff9c4a55 52%, #ff9c4a00 100%); }
.iso[data-theme="light"] .lm-flash { mix-blend-mode: multiply; background: radial-gradient(circle closest-side at var(--gx, 50%) var(--gy, 50%), #ffd36b 0%, #ffbf4dcc 24%, #ffb24a44 56%, #ffb24a00 100%); }
.lm-stage[data-gl] .lm-fallback { display: none; }

/* selection: one assembly lit, everything else one step down */
.it { transition: opacity 240ms var(--anatomy-ease); }
.lm-stage[data-focus] .it:not([data-on]) { --anatomy-hi: var(--anatomy-mid); --anatomy-mid: var(--anatomy-lo); }
.lm-stage[data-focus] .it:not([data-on]) .lm-foil { --lm-foil-line: var(--lm-foil-faint); }
.it[data-on] { --anatomy-hi: var(--anatomy-lit); --anatomy-mid: var(--anatomy-hi); }
.it[data-on] .iso-top, .it[data-on] .tb-shine { fill: var(--anatomy-lit-top); }
.it[data-on] .iso-shade, .it[data-on] .tb-body { fill: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-shade { stroke: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-top { stroke: var(--anatomy-lit-top); }
.it[data-on] .lm-foil { --lm-foil-line: #ffe7a6; --lm-foil-top: #7a6124; --lm-foil-3: #6a5420; }
.iso[data-theme="light"] .it[data-on] .lm-foil { --lm-foil-line: #3d2a05; }
.it[data-gone] { opacity: 0; }

/* controls */
.lm-controls { position: absolute; left: 20px; bottom: 16px; right: 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lm-fire { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--anatomy-lo); background: var(--anatomy-face); color: var(--anatomy-strong); font: 700 13px/1 "Atkinson Hyperlegible", system-ui, sans-serif; cursor: pointer; }
.lm-fire:hover { border-color: var(--anatomy-mid); }
.lm-fire:focus-visible { outline: 2px solid var(--lm-brand); outline-offset: 2px; }
.lm-lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--anatomy-lo); transition: background 200ms, box-shadow 200ms; }
.lm-fire[data-state="burn"] .lm-lamp { background: var(--lm-brand); box-shadow: 0 0 10px var(--lm-brand); }
.lm-fire[data-state="left"] .lm-lamp { background: var(--lm-moon); }
.lm-hint { font-size: 12px; color: var(--anatomy-muted); }
.lm-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.lm .iso-plate-corner[data-corner="readout"] { bottom: 22px; font-variant-numeric: tabular-nums; }
.lm-lang { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: inline-flex; border: 1px solid var(--anatomy-faint); border-radius: 999px; overflow: hidden; z-index: 2; }
.lm-lang button { min-width: 40px; min-height: 26px; border: 0; background: transparent; color: var(--anatomy-muted); font: 700 11px/1 "Atkinson Hyperlegible", system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; }
.lm-lang button[aria-pressed="true"] { background: var(--anatomy-face); color: var(--anatomy-strong); }

/* legend: the parts as buttons */
.lm-parts { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 12px; }
.lm-part { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border: 1px solid var(--anatomy-faint); border-radius: 999px; background: transparent; color: var(--anatomy-text); font: 400 12.5px/1 "Atkinson Hyperlegible", system-ui, sans-serif; cursor: pointer; }
.lm-part:hover { border-color: var(--anatomy-lo); color: var(--anatomy-strong); }
.lm-part[data-on] { border-color: var(--anatomy-mid); color: var(--anatomy-strong); background: var(--anatomy-face); }
.lm-num { font-variant-numeric: tabular-nums; color: var(--anatomy-muted); font-size: 11px; }
.lm .iso-caption { max-width: 72ch; }

@media (max-width: 640px) {
  .lm .iso-plate { padding: 44px 8px 92px; }
  .lm-stage { margin: 0 -8%; width: 116%; }
  .lm-hint { display: none; }
  .lm .iso-plate-corner[data-corner="readout"] { bottom: 62px; }
  .lm-lang { top: auto; bottom: 20px; left: auto; right: 16px; transform: none; }
}
@media (prefers-reduced-motion: reduce) {

// ---------- debris: shreds of gold foil thrown off by the staging, ballistic in vacuum ----------
const DEBRIS = 42;
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const flecks = Array.from({ length: DEBRIS }, () => {
  const a = rand() * Math.PI * 2;

  const out = (1.6 + rand() * 3.6) * M;
  return { p0: [Math.cos(a) * r, -6 + Math.sin(a) * r, 120 + rand() * 10], v: [Math.cos(a) * out, Math.sin(a) * out, (0.8 + rand() * 3.2) * M], spin: 4 + rand() * 9, phase: rand() * 6.28, life: 1.6 + rand() * 1.4 };

    const { b, f } = dots[i];
    if (age <= 0 || age > fl.life || still.matches) { b.style.display = f.style.display = "none"; return; }

// ---------- WebGL: staging flash, the faint vacuum plume, light on the deck ----------
const FRAGMENT = `
uniform float uFlash;
uniform float uFlashR;
uniform float uThrust;
uniform float uH;
uniform float uLight;
const vec2 AX=vec2(0.,-14.);
const float DECK=${D.deckZ.toFixed(1)};
float octagon(vec2 p){
  vec2 q=abs(p);
  float d=max(q.x,q.y);
  d=max(d,(q.x+q.y)*0.70710678);
  return d-84.5;
}
vec4 over(vec4 top,vec4 under){return top+under*(1.-top.a);}
vec4 inkFor(vec3 seen,float cover){vec3 absorbed=1.-seen;float a=max(max(absorbed.r,max(absorbed.g,absorbed.b)),cover);return vec4(vec3(a)-absorbed,a);}
void main(){

  vec3 C=vec3(0.,-6.,130.);

    float t1=(ez-p0.z)/V.z;

    const ry = r * k * D.camera.cam[2] + 0.6;
    const big = 4000;
    const d = liftUnits >= D.aps.len ? `M${-big} ${-big}H${big}V${big}H${-big}Z` : `M${(c[0] - big).toFixed(1)} ${(c[1] - big).toFixed(1)}H${(c[0] + big).toFixed(1)}V${c[1].toFixed(1)}H${(c[0] + rx).toFixed(1)}A${rx.toFixed(2)} ${ry.toFixed(2)} 0 0 1 ${(c[0] - rx).toFixed(1)} ${c[1].toFixed(1)}H${(c[0] - big).toFixed(1)}Z`;
    apsClip.setAttribute("d", d);
    apsClip.setAttribute("transform", liftUnits > 0.01 ? `translate(${(-dx).toFixed(2)} ${(-dy).toFixed(2)})` : "");
  }
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  let active = false;
  if (touring) tour(dt);
  if (phase === "burn") {
    burnClock += dt;
    stepAscent(dt);
    if (burnClock > 0.25 && !flag.falling) { flag.falling = true; flag.w = 0.45; }
    if (burnClock > 12) { phase = "left"; fire.dataset.state = "left"; announce(T().phases.left); }
    active = true;
  }
  if (phase === "return") {
    const moving = settle(back, 0, dt, 0.42, calm);
    ascent.h = (returnFrom * back.x) / M;
    flag.th = Math.min(flag.th, FLAG_REST * back.x * 1.0);
    flag.falling = false;
    if (!moving || back.x < 1e-3) { phase = "rest"; ascent.h = 0; flag.th = 0; back.x = 0; announce(T().phases.rest); }
    active = true;
  }
  if (flag.falling && flag.th < FLAG_REST) {
    const n = 4;
    for (let i = 0; i < n; i++) {
      flag.w += FLAG_C * Math.sin(flag.th) * (dt / n);
      flag.th += flag.w * (dt / n);
    }
    if (flag.th >= FLAG_REST) { flag.th = FLAG_REST; flag.w = 0; }
    active = true;
  }
  liftUnits = phase === "rest" ? 0 : Math.min(ascent.h * M, 2000);
  place();
  drawFlag();
  // readout from the same model that moves the stage
  if (phase === "burn") {
    const t = T();
    const v = ascent.v;
    const text = `T+${num(ascent.t, 1)} s · ${num(ascent.h, ascent.h < 100 ? 1 : 0)} m · ${num(v, 1)} m/s · ${ascent.t < D.model.aps.rise ? t.rising : t.pitch}`;
    say(text);
  } else if (phase === "left") say(T().left);
  else if (phase === "return") say(T().returning);
  else if (selected) say(`${partText(selected).name} · ${partText(selected).say}`);
  else say(T().rest);
  // effects
  const age = phase === "burn" ? burnClock : -1;
  const flash = calm || age < 0 ? 0 : burst(age, 0.06, 0.22);
  const thrust = phase === "burn" && !calm ? smooth(0, 0.15, age) : 0;
  drawDebris(phase === "burn" ? age : -1);
  if (layer) {
    if (flash > 1e-3 || (thrust > 1e-3 && liftUnits < 900)) layer.draw({ uFlash: flash, uFlashR: 34 + 90 * smooth(0, 0.35, age), uThrust: thrust, uH: liftUnits }, clock);
    else layer.clear();
  } else flashEl.style.opacity = (flash * 0.8).toFixed(3);
  if (age >= 0 && age < 3.5) active = true;
  const keep = active || touring || dirty;
  dirty = false;
  frame = visible && keep ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// ---------- idle tour ----------
const TOUR = ["ascent", "windows", "antennas", "rcs", "descent", "gear", "probes", "ladder", "mesa", "lrrr", "psep", "liftoff", "wait", "wait", "wait", "rewind", "dps", "flag"];
let touring = !still.matches;
let tourClock = 0;
let tourStep = -1;
let idleTimer = 0;
function tour(dt) {
  tourClock += dt;
  const step = Math.floor(tourClock / 2.6) % TOUR.length;
  if (step === tourStep) return;
  tourStep = step;
  const what = TOUR[step];
  if (what === "liftoff") { select(null); if (phase === "rest") liftoff(); }
  else if (what === "rewind") { if (phase === "left" || phase === "burn") rewind(); }
  else if (what !== "wait") { if (phase === "rest") select(what); }
}
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!still.matches) { touring = true; tourClock = 0; tourStep = -1; run(); } }, 9000);
}

// ---------- input ----------
stage.addEventListener("pointermove", (event) => {
  takeOver();
  const item = event.target.closest && event.target.closest(".it");
  const id = item && item.dataset.piece !== "stand" ? item.dataset.piece : null;
  select(id);
});
stage.addEventListener("pointerleave", () => select(null));
stage.addEventListener("click", (event) => {
  const item = event.target.closest && event.target.closest(".it");
  if (!item) return;
  takeOver();
  select(item.dataset.piece !== "stand" ? item.dataset.piece : null);
});
buttons.forEach((b) => {
  b.addEventListener("mouseenter", () => { takeOver(); select(b.dataset.part); });
  b.addEventListener("focus", () => { takeOver(); select(b.dataset.part); });
  b.addEventListener("click", () => { takeOver(); select(b.dataset.part); });
});
fire.addEventListener("click", () => { takeOver(); liftoff(); });
stage.addEventListener("keydown", (event) => {
  const ids = D.parts.map((p) => p.id);
  let index = ids.indexOf(selected);
  if (event.key === "ArrowRight" || event.key === "ArrowDown") index = (index + 1) % ids.length;
  else if (event.key === "ArrowLeft" || event.key === "ArrowUp") index = (index - 1 + ids.length) % ids.length;
  else if (event.key === "Home") index = 0;
  else if (event.key === "End") index = ids.length - 1;
  else if (event.key === "l" || event.key === "L" || event.key === " " || event.key === "Enter") { event.preventDefault(); takeOver(); liftoff(); return; }
  else if (event.key === "Escape") { takeOver(); select(null); rewind(); return; }
  else return;
  event.preventDefault();
  takeOver();
  select(ids[index]);
  announce(`${partText(ids[index]).name} · ${partText(ids[index]).say}`);
});
stage.addEventListener("focus", () => announce(selected ? partText(selected).name : T().rest));

applyLang();
drawFlag();
place();
</script></body></html>
